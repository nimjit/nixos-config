<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NixOS Config — Snowflake</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2b2723;color:#ccc2b7;font-family:system-ui,sans-serif;overflow:hidden}
  svg{display:block;width:100vw;height:100vh}
  .link-tree{fill:none;stroke:#413632;stroke-opacity:.85}
  .node{cursor:default}
  .node.clickable{cursor:pointer}
  .node circle{transition:r .1s}
  .node.clickable:hover circle{stroke:#e0ba86!important;stroke-width:2!important}
  .label{pointer-events:none;dominant-baseline:central}
  #tip{
    position:fixed;top:0;left:0;padding:7px 12px;
    background:#372d29f0;border:1px solid #504431;border-radius:4px;
    font-size:12px;pointer-events:none;display:none;
    max-width:320px;line-height:1.5;color:#ccc2b7;z-index:10
  }
  #info{position:fixed;bottom:14px;left:14px;font-size:10px;color:#504431;pointer-events:none}
  #legend{
    position:fixed;top:14px;right:14px;
    background:#372d29cc;border:1px solid #504431;
    border-radius:4px;padding:10px 14px;font-size:10px;line-height:1.85;
  }
  #legend h4{color:#868074;font-weight:normal;margin-bottom:4px;font-size:9px;
             letter-spacing:.08em;text-transform:uppercase}
  .li{display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<svg id="chart"></svg>
<div id="tip"></div>
<div id="info">scroll → zoom &nbsp;·&nbsp; drag → pan &nbsp;·&nbsp; click file → open in browser</div>
<div id="legend"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const MODULES = {"name": "modules", "id": "modules", "path": "modules", "type": "root", "depth": 0, "children": [{"name": "common", "id": "modules/common.nix", "path": "modules/common.nix", "type": "file", "depth": 1, "children": []}, {"name": "flake-update", "id": "modules/flake-update.nix", "path": "modules/flake-update.nix", "type": "file", "depth": 1, "children": []}, {"name": "stylix", "id": "modules/stylix.nix", "path": "modules/stylix.nix", "type": "file", "depth": 1, "children": []}, {"name": "syncthing", "id": "modules/syncthing.nix", "path": "modules/syncthing.nix", "type": "file", "depth": 1, "children": []}, {"name": "tailscale", "id": "modules/tailscale.nix", "path": "modules/tailscale.nix", "type": "file", "depth": 1, "children": []}]};
const HOME    = {"name": "home", "id": "home", "path": "home", "type": "root", "depth": 0, "children": [{"name": "btop", "id": "home/btop.nix", "path": "home/btop.nix", "type": "file", "depth": 1, "children": []}, {"name": "default", "id": "home/default.nix", "path": "home/default.nix", "type": "file", "depth": 1, "children": []}, {"name": "emacs", "id": "home/emacs.nix", "path": "home/emacs.nix", "type": "file", "depth": 1, "children": []}, {"name": "email", "id": "home/email.nix", "path": "home/email.nix", "type": "file", "depth": 1, "children": []}, {"name": "firefox", "id": "home/firefox.nix", "path": "home/firefox.nix", "type": "file", "depth": 1, "children": []}, {"name": "git", "id": "home/git.nix", "path": "home/git.nix", "type": "file", "depth": 1, "children": []}, {"name": "khal", "id": "home/khal.nix", "path": "home/khal.nix", "type": "file", "depth": 1, "children": []}, {"name": "kitty", "id": "home/kitty.nix", "path": "home/kitty.nix", "type": "file", "depth": 1, "children": []}, {"name": "kwin", "id": "home/kwin.nix", "path": "home/kwin.nix", "type": "file", "depth": 1, "children": []}, {"name": "mako", "id": "home/mako.nix", "path": "home/mako.nix", "type": "file", "depth": 1, "children": []}, {"name": "mpd", "id": "home/mpd.nix", "path": "home/mpd.nix", "type": "file", "depth": 1, "children": []}, {"name": "mpv", "id": "home/mpv.nix", "path": "home/mpv.nix", "type": "file", "depth": 1, "children": []}, {"name": "nchat", "id": "home/nchat.nix", "path": "home/nchat.nix", "type": "file", "depth": 1, "children": []}, {"name": "neovim", "id": "home/neovim.nix", "path": "home/neovim.nix", "type": "file", "depth": 1, "children": []}, {"name": "qutebrowser", "id": "home/qutebrowser.nix", "path": "home/qutebrowser.nix", "type": "file", "depth": 1, "children": []}, {"name": "rofi", "id": "home/rofi.nix", "path": "home/rofi.nix", "type": "file", "depth": 1, "children": []}, {"name": "yazi", "id": "home/yazi.nix", "path": "home/yazi.nix", "type": "file", "depth": 1, "children": []}, {"name": "zathura", "id": "home/zathura.nix", "path": "home/zathura.nix", "type": "file", "depth": 1, "children": []}, {"name": "zsh", "id": "home/zsh.nix", "path": "home/zsh.nix", "type": "file", "depth": 1, "children": []}, {"name": "dotfiles", "id": "home/dotfiles", "path": "home/dotfiles", "type": "folder", "depth": 1, "children": [{"name": "btop", "id": "home/dotfiles/btop", "path": "home/dotfiles/btop", "type": "folder", "depth": 2, "children": [{"name": "btop.conf", "id": "home/dotfiles/btop/btop.conf", "path": "home/dotfiles/btop/btop.conf", "type": "file", "depth": 3, "children": []}]}, {"name": "calcurse", "id": "home/dotfiles/calcurse", "path": "home/dotfiles/calcurse", "type": "folder", "depth": 2, "children": [{"name": "conf", "id": "home/dotfiles/calcurse/conf", "path": "home/dotfiles/calcurse/conf", "type": "file", "depth": 3, "children": []}, {"name": "keys", "id": "home/dotfiles/calcurse/keys", "path": "home/dotfiles/calcurse/keys", "type": "file", "depth": 3, "children": []}]}, {"name": "khal", "id": "home/dotfiles/khal", "path": "home/dotfiles/khal", "type": "folder", "depth": 2, "children": [{"name": "config", "id": "home/dotfiles/khal/config", "path": "home/dotfiles/khal/config", "type": "file", "depth": 3, "children": []}]}, {"name": "kitty", "id": "home/dotfiles/kitty", "path": "home/dotfiles/kitty", "type": "folder", "depth": 2, "children": [{"name": "pass_keys.py", "id": "home/dotfiles/kitty/pass_keys.py", "path": "home/dotfiles/kitty/pass_keys.py", "type": "file", "depth": 3, "children": []}]}, {"name": "nchat", "id": "home/dotfiles/nchat", "path": "home/dotfiles/nchat", "type": "folder", "depth": 2, "children": [{"name": "color.conf", "id": "home/dotfiles/nchat/color.conf", "path": "home/dotfiles/nchat/color.conf", "type": "file", "depth": 3, "children": []}, {"name": "key.conf", "id": "home/dotfiles/nchat/key.conf", "path": "home/dotfiles/nchat/key.conf", "type": "file", "depth": 3, "children": []}, {"name": "ui.conf", "id": "home/dotfiles/nchat/ui.conf", "path": "home/dotfiles/nchat/ui.conf", "type": "file", "depth": 3, "children": []}]}]}]};
const HOSTS   = {"name": "hosts", "id": "hosts", "path": "hosts", "type": "root", "depth": 0, "children": [{"name": "desktop", "id": "hosts/desktop", "path": "hosts/desktop", "type": "host", "depth": 1, "children": [{"name": "default", "id": "hosts/desktop/default.nix", "path": "hosts/desktop/default.nix", "type": "file", "depth": 2, "children": []}]}, {"name": "laptop", "id": "hosts/laptop", "path": "hosts/laptop", "type": "host", "depth": 1, "children": [{"name": "default", "id": "hosts/laptop/default.nix", "path": "hosts/laptop/default.nix", "type": "file", "depth": 2, "children": []}]}, {"name": "usb", "id": "hosts/usb", "path": "hosts/usb", "type": "host", "depth": 1, "children": [{"name": "default", "id": "hosts/usb/default.nix", "path": "hosts/usb/default.nix", "type": "file", "depth": 2, "children": []}]}]};
const PLANS   = {"name": "plans", "id": "plans", "path": "plans", "type": "root", "depth": 0, "children": []};

const SCOL = {
  "modules": "#d4956a",
  "home":    "#6abd9a",
  "hosts":   "#6a9fd4",
  "plans":   "#d4c04a",
  "themes":  "#a07ec8",
};

function sectionColor(d, sectionName) {
  if (d.depth === 0) return "#ba945f";
  return SCOL[sectionName] || "#868074";
}

const W = window.innerWidth, H = window.innerHeight, MWMH = Math.min(W, H);
const rxy = (a, r) => [r * Math.cos(a - Math.PI/2), r * Math.sin(a - Math.PI/2)];
const nrad = (d, sc=1) => d.depth===0 ? 9*sc : d.depth===1 ? 6*sc : d.depth===2 ? 4*sc : 2.5*sc;
const trunc = (s, n=26) => s.length > n ? s.slice(0, n-1) + "…" : s;
const isFile = d => d.data.type === "file";

const svg   = d3.select("#chart").attr("width", W).attr("height", H);
const zoom  = d3.zoom().scaleExtent([0.1, 14]).on("zoom", e => gRoot.attr("transform", e.transform));
svg.call(zoom);
const gRoot = svg.append("g");

const tip = document.getElementById("tip");
function showTip(ev, d) {
  tip.style.display = "block";
  tip.style.left = (ev.clientX + 14) + "px";
  tip.style.top  = (ev.clientY - 8) + "px";
  const pathStr = d.data.id ? `/etc/nixos/${d.data.id}` : d.data.name;
  tip.innerHTML = `<strong>${d.data.name}</strong><br>
    <span style="color:#868074;font-size:10px">${pathStr}</span>`;
}

function renderFlake(container, root, colorFn, labelDepth, nodeScale) {
  container.append("g").selectAll("path")
    .data(root.links()).join("path").attr("class","link-tree")
    .attr("stroke-width", d => d.source.depth===0 ? 1.5 : d.source.depth===1 ? 1.1 : 0.7)
    .attr("d", d3.linkRadial().angle(d=>d.x).radius(d=>d.y));

  const nodes = container.append("g").selectAll("g")
    .data(root.descendants()).join("g")
    .attr("class", d => "node" + (isFile(d) ? " clickable" : ""))
    .attr("transform", d => { const [x,y]=rxy(d.x,d.y); return `translate(${x},${y})`; })
    .on("mousemove", showTip)
    .on("mouseleave", () => tip.style.display = "none")
    .on("click", (ev, d) => {
      if (!isFile(d) || !d.data.path) return;
      window.open(`file:///etc/nixos/${d.data.path}`, "_blank");
    });

  nodes.append("circle")
    .attr("r",      d => nrad(d, nodeScale))
    .attr("fill",   d => colorFn(d))
    .attr("stroke", d => d.depth===0 ? "#e0ba86" : "#2b2723")
    .attr("stroke-width", d => d.depth===0 ? 1.5 : 0.4);

  nodes.filter(d => d.depth >= 1 && d.depth <= labelDepth)
    .append("text").attr("class","label")
    .attr("x", d => d.x < Math.PI ? nrad(d,nodeScale)+4 : -(nrad(d,nodeScale)+4))
    .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
    .text(d => trunc(d.data.name))
    .attr("fill", d => d.depth===1 ? "#ccc2b7" : colorFn(d) + (d.depth>2?"bb":""))
    .attr("font-size", d => d.depth===1 ? "12px" : d.depth===2 ? "10px" : "8.5px");

  container.append("text").attr("text-anchor","middle").attr("dy",".35em")
    .attr("fill","#ba945f").attr("font-size","14px").attr("pointer-events","none").text("⬡");
}

// Layout: modules (centre), home (left, large), hosts (right), plans (small far-right)
const R_m = MWMH * 0.22;
const R_h = MWMH * 0.32;
const R_o = MWMH * 0.14;
const R_p = MWMH * 0.09;
const GAP = MWMH * 0.06;

const mRoot = d3.hierarchy(MODULES).sort((a,b)=>d3.ascending(a.data.name,b.data.name));
d3.cluster().size([2*Math.PI, R_m])(mRoot);
const gM = gRoot.append("g");
renderFlake(gM, mRoot, d => sectionColor(d,"modules"), 2, 1);

const hRoot = d3.hierarchy(HOME).sort((a,b)=>d3.ascending(a.data.name,b.data.name));
d3.cluster().size([2*Math.PI, R_h])(hRoot);
const sepH = R_m + GAP + R_h;
const gH = gRoot.append("g").attr("transform", `translate(${-sepH}, 0)`);
renderFlake(gH, hRoot, d => sectionColor(d,"home"), 3, 0.85);

const oRoot = d3.hierarchy(HOSTS).sort((a,b)=>d3.ascending(a.data.name,b.data.name));
d3.cluster().size([2*Math.PI, R_o])(oRoot);
const sepO = R_m + GAP + R_o;
const gO = gRoot.append("g").attr("transform", `translate(${sepO}, 0)`);
renderFlake(gO, oRoot, d => sectionColor(d,"hosts"), 2, 0.85);

const pRoot = d3.hierarchy(PLANS).sort((a,b)=>d3.ascending(a.data.name,b.data.name));
d3.cluster().size([2*Math.PI, R_p])(pRoot);
const sepP = sepO + R_o + GAP + R_p;
const gP = gRoot.append("g").attr("transform", `translate(${sepP}, 0)`);
renderFlake(gP, pRoot, d => sectionColor(d,"plans"), 2, 0.75);

// Section labels
[[-sepH, R_h, "home/", "#6abd9a"], [sepO, R_o, "hosts/", "#6a9fd4"], [sepP, R_p, "plans/", "#d4c04a"]]
  .forEach(([x, r, name, col]) => {
    gRoot.append("text").attr("transform", `translate(${x}, ${-(r+22)})`)
      .attr("text-anchor","middle").attr("fill",col).attr("font-size","12px")
      .attr("opacity",0.7).attr("pointer-events","none").text(name);
  });

const totalW = sepH + R_h + sepP + R_p + 200;
const totalH = 2*(R_h + 80);
const initScale = Math.min(W/totalW, H/totalH, 1);
svg.call(zoom.transform, d3.zoomIdentity.translate(W/2, H/2).scale(initScale));

document.getElementById("legend").innerHTML = `
  <h4>Sections</h4>
  <div class="li"><span class="dot" style="background:#d4956a"></span>modules/ (system)</div>
  <div class="li"><span class="dot" style="background:#6abd9a"></span>home/ (HM modules)</div>
  <div class="li"><span class="dot" style="background:#6a9fd4"></span>hosts/ (machines)</div>
  <div class="li"><span class="dot" style="background:#d4c04a"></span>plans/</div>`;
</script>
</body>
</html>
